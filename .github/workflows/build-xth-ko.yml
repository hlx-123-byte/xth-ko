name: Build xth_ko (kernel module)

# 手动触发，避免循环。用 KernelSU ddk 容器编 arm64 external module。
# 产物通过 Contents API 写回 dist/xth_ko.ko（api.github.com 稳定可达）。
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android12-5.10-20260313
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build xth_ko.ko
        run: |
          set -e
          echo "KDIR=$KDIR"
          cd kernel
          if [ -x "$KDIR/scripts/config" ]; then
            "$KDIR/scripts/config" --file "$KDIR/.config" -d MODVERSIONS || true
            make -C "$KDIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig >/dev/null || true
          fi
          make -j"$(nproc)" KBUILD_MODPOST_WARN=1
          llvm-strip -d xth_ko.ko || true
          echo "=== modinfo ==="
          llvm-readelf -p .modinfo xth_ko.ko | grep -E 'name|vermagic|license' || true
          echo "=== sections ==="
          llvm-readelf -SW xth_ko.ko | grep -E '__versions|\.modinfo' || true
          echo "=== size ==="
          ls -l xth_ko.ko

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v7
        with:
          name: xth_ko
          path: kernel/xth_ko.ko

      - name: Publish .ko via Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/dist/xth_ko.ko"
          B64="$(base64 -w0 kernel/xth_ko.ko)"
          SHA="$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API" | sed -n 's/.*"sha": *"\([^"]*\)".*/\1/p' | head -1)"
          if [ -n "$SHA" ]; then
            BODY="{\"message\":\"build: xth_ko.ko\",\"content\":\"$B64\",\"sha\":\"$SHA\",\"branch\":\"main\"}"
          else
            BODY="{\"message\":\"build: xth_ko.ko\",\"content\":\"$B64\",\"branch\":\"main\"}"
          fi
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d "$BODY" "$API" | head -c 400
          echo
          echo "published to dist/xth_ko.ko"
